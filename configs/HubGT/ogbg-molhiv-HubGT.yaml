accelerator: cuda:0
dataset:
  edge_encoder: true
  edge_encoder_bn: false
  edge_encoder_name: Bond
  format: OGB
  name: ogbg-molhiv
  node_encoder: true
  node_encoder_bn: false
  node_encoder_name: Atom
  split_mode: standard
  task: graph
  task_type: classification
  transductive: false
gnn:
  act: gelu
  agg: mean
  batchnorm: true
  dim_inner: 96
  dropout: 0.1
  head: san_graph
  layers_post_mp: 1
  layers_pre_mp: 0
  normalize_adj: false
gt:
  attn_dropout: 0.1
  batch_norm: true
  dim_hidden: 96
  dropout: 0.1
  layers: 8
  n_heads: 4
metric_agg: argmax
metric_best: auc
model:
  edge_decoding: dot
  graph_pooling: mean
  loss_fun: cross_entropy
  type: HubGT
optim:
  base_lr: 0.001
  clip_grad_norm: true
  max_epoch: 100
  num_warmup_epochs: 10
  optimizer: adamW
  scheduler: cosine_with_warmup
  weight_decay: 1e-4
out_dir: results
train:
  batch_size: 32
  ckpt_period: 100
  enable_ckpt: false
  eval_period: 1
  mode: custom
  sampler: full_batch
wandb:
  project: ogbg-molhiv
  use: false
