accelerator: cuda:3
dataset:
  edge_encoder: true
  edge_encoder_bn: false
  edge_encoder_name: DummyEdge
  format: PyG-WebKB
  name: texas
  node_encoder: true
  node_encoder_bn: false
  node_encoder_name: LapPE
  split_mode: standard
  task: node
  task_type: classification
  transductive: true
gnn:
  act: relu
  agg: mean
  batchnorm: true
  dim_inner: 56
  dropout: 0.0
  head: node
  layers_post_mp: 3
  layers_pre_mp: 0
  normalize_adj: false
gt:
  batch_norm: true
  dim_hidden: 56
  dropout: 0.0
  full_graph: true
  gamma: 1e-5
  layer_norm: false
  layers: 2
  n_heads: 2
  residual: true
metric_best: accuracy
model:
  edge_decoding: dot
  graph_pooling: add
  loss_fun: cross_entropy
  type: SANTransformer
optim:
  base_lr: 0.0007
  clip_grad_norm: true
  max_epoch: 400
  num_warmup_epochs: 20
  optimizer: adamW
  scheduler: cosine_with_warmup
  weight_decay: 0.0
out_dir: results
posenc_LapPE:
  dim_pe: 8
  eigen:
    eigvec_norm: L2
    laplacian_norm: sym
    max_freqs: 10
  enable: true
  layers: 2
  model: Transformer
  n_heads: 4
  raw_norm_type: none
train:
  batch_size: 32
  ckpt_period: 100
  eval_period: 1
  mode: custom
wandb:
  project: texas
  use: false
